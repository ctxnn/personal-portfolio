name: Refresh GitHub activity snapshot

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-github-activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Refresh the contribution snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-github-activity.mjs

      - name: Commit an updated snapshot
        id: snapshot
        run: |
          if git diff --quiet -- github-activity.js; then
            echo "The contribution snapshot is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-activity.js
          git commit -m "chore: refresh GitHub activity snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the GitHub Pages site
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
